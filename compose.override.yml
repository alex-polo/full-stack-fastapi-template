services:
  db:
    ports:
      - "${POSTGRES_PORT?Variable not set}:${POSTGRES_PORT?Variable not set}"
    restart: "no"
    logging:
      driver: "none"

  redis:
    restart: "no"
    ports:
      - "${REDIS_PORT?Variable not set}:${REDIS_PORT?Variable not set}"
    logging:
      driver: "none"
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: "no"
    ports: !override
      - "${BACKEND_PORT?Variable not set}:${BACKEND_PORT?Variable not set}"
    depends_on: !override
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck: !reset
    environment:
      BACKEND__UVICORN__PORT: ${BACKEND_PORT?Variable not set}
    volumes: !override
      - ./backend/certificates:/app/certificates
    #   - ./backend/htmlcov:/app/htmlcov
    develop:
      # Create a `watch` configuration to update the app
      # https://docs.docker.com/compose/file-watch/#compose-watch-versus-bind-mounts
      watch:
        # Sync the working directory with the `/app` directory in the container
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./uv.lock
    networks:
      - app-network
    logging:
      driver: "none"

  maildev:
    image: maildev/maildev
    restart: "no"
    ports:
      - "${MAILDEV_WEB_PORT?Variable not set}:1080"
      - "${MAILDEV_SMTP_PORT?Variable not set}:1025"
    environment:
      - TZ=Europe/Moscow
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      - app-network
    logging:
      driver: "none"

  pgadmin:
    restart: "no"
    logging:
      driver: "none"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=development
    restart: "no"
    ports: !override
      - "${CLIENT_PORT?Variable not set}:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      disable: true
    environment:
      VITE_API_URL: ${BACKEND_API_PREFIX?Variable not set}
      VITE_BACKEND_HOST: ${BACKEND_HOST?Variable not set}
      VITE_BACKEND_PORT: ${BACKEND_PORT?Variable not set}
    volumes:
      - ./client:/spa
      - client-node-modules:/spa/node_modules
    networks:
      - app-network
    logging:
      driver: "none"

volumes:
  client-node-modules:
